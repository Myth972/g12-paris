<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hors connexion — G12 Paris Infos Médias</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: light dark;
        --primary: #d92323;
        --bg: #ffffff;
        --fg: #18181b;
        --muted: #71717a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #09090b;
          --fg: #fafafa;
          --muted: #a1a1aa;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          sans-serif;
        text-align: center;
      }
      .card {
        max-width: 460px;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        margin-bottom: 24px;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 12px;
      }
      p {
        color: var(--muted);
        line-height: 1.6;
        margin: 0 0 28px;
      }
      button {
        background: var(--primary);
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 12px 24px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/logo.png" alt="G12 Paris Infos Médias" />
      <h1>Vous êtes hors connexion</h1>
      <p>
        La connexion internet n'est pas disponible. Vérifiez votre réseau puis
        réessayez d'accéder aux actualités.
      </p>
      <button onclick="location.reload()">Réessayer</button>
    </div>
  </body>
</html>
