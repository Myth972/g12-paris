    <link

      as="style"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=Inter:wght@300;400;500;600;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#d92323" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/icon-192x192.png" />

    <meta
      name="description"
      content="G12 Paris Infos Médias : actualités, publications, galeries, événements et bibliothèque. Votre source d'information de confiance."
    />
    <meta name="robots" content="index, follow" />

    <meta property="og:site_name" content="G12 Paris Infos Médias" />
    <meta property="og:locale" content="fr_FR" />

      property="og:description"
      content="G12 Paris Infos Médias : actualités, publications, galeries, événements et bibliothèque."
    />

    <meta property="og:image:alt" content="G12 Paris Infos Médias" />

    <meta name="twitter:card" content="summary_large_image" />
    <!-- Load mojs from CDN — version 1.5.1 stable et bien testée -->
    <script src="https://cdn.jsdelivr.net/npm/@mojs/core@1.5.1/dist/mo.umd.js" defer></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      if (import.meta.env.PROD && "serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then(registration => {
              console.log("SW registered: ", registration);
            })
            .catch(registrationError => {
              console.log("SW registration failed: ", registrationError);
            });
        });
      }
    </script>
  </body>
